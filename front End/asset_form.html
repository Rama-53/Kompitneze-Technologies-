<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/asset_form.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Asset Request Form</legend>
            
            <h3 for="name">Name</h3>
            <input type="text" id="first_name"><br>
            <label for="first_name">First</label>
            <br>
            <input type="text" id="last_name">
            <br>
            <label for="last_name">Last</label>
            <br>
            

            <label for="emp_id">Employee ID</label>
            <br>
            <br>

            <label class="input-box">
                <i class="fa-solid fa-id-card"></i>
                <input type="number" id="emp_id">
            </label>
            <br>
            <br>

            <label for="email">Email</label>
            <br>

            <label class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email">
            </label>
            <br>
            <br>

            <label for="dept">Department</label>
            <br>

            <label class="input-box">
                <i class="fa-solid fa-school"></i>
                <input type="text" id="dept">
            </label>


            <h3 for="issue">Issue</h3>
            <input type="radio" id="issue1" name="issues">
            <label for="issue1">New Asset request</label>
            <br>
            <input type="radio" id="issue2" name="issues">
            <label for="issue1">Replacement for broken/faulty device</label>
            <br>
            <input type="radio" id="issue3" name="issues">
            <label for="issue1">Replacement of lost device</label>
            <br>
            <input type="radio" id="issue4" name="issues">
            <label for="issue1">Other reason</label>
            
            <h3>Asset Required</h3>
            <input type="checkbox" id="check1" name="laptop" value="laptop">
            <label for="check1">Laptop</label>
            <br>
            <input type="checkbox" id="check2" name="desktop" value="desktop">
            <label for="check3">Desktop</label>
            <br>
            <input type="checkbox" id="check3" name="wireless_k" value="wireless_k">
            <label for="check4">Wireless Keyboard</label>
            <br>
            <input type="checkbox" id="check4" name="wireless_m" value="wireless_m">
            <label for="check4">Wireless Mouse</label>
            <br>
            <br>
            <button>Submit</button>
        </fieldset>
    </form>
</body>
</html>
