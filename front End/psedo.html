    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        button:hover{
            background-color: blue;
            color: white;
        }
        a:active{
            color: red;
        }
        input:focus{
            border: 5px solid green;
        }
        p:first-child{
            color: red;
        }
        p:last-child{
            color:greenyellow
        }
        /* parameters can be number,odd or even */
        p:nth-child(even){
            color: aqua;
        }
        h2::first-letter{
            color: brown;
        }
        h2::first-line{
            color: blueviolet;
        }
        h3 ::after{
        content: "\f00c";
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
        margin-left: 8px;
        }
        input[type ]{
        border: 2px solid ;
        }
        
    </style>
</head>
